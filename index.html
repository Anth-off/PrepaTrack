<!doctype html>
<html lang="fr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Même teinte que la barre d'onglets : iOS utilise cette couleur pour
         les zones système situées hors du viewport de l'app installée. -->
    <meta name="theme-color" content="#0b0f14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      `black-translucent` donne à la page le viewport plein écran.

      Avec `black`, iOS réduit le viewport de la hauteur de la barre de statut
      tout en le laissant ancré en haut sur certains iPhone : la place retirée
      réapparaît alors comme une bande vide en bas. Le contenu reste hors de
      l'encoche grâce aux `safe-area-inset-*` appliqués par l'application.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PrepaTrack" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>PrepaTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
