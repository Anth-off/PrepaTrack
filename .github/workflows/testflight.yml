name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  upload:
    name: Compiler et envoyer à TestFlight
    runs-on: macos-latest
    timeout-minutes: 45
    environment: app-store-connect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Installer et synchroniser l'application
        run: |
          npm ci
          npm run ios:sync
      - name: Lire la version applicative
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Préparer la clé App Store Connect
        env:
          PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          test -n "$PRIVATE_KEY_BASE64"
          test -n "$KEY_ID"
          mkdir -p "$RUNNER_TEMP/appstoreconnect/private_keys"
          echo "$PRIVATE_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          chmod 600 "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
      - name: Installer le certificat et le profil de distribution
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          LIVE_ACTIVITY_PROFILE_BASE64: ${{ secrets.IOS_LIVE_ACTIVITY_PROFILE_BASE64 }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_BASE64"
          test -n "$LIVE_ACTIVITY_PROFILE_BASE64"
          keychain_path="$RUNNER_TEMP/prepatrack-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          echo "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/PrepaTrack.mobileprovision"
          echo "$LIVE_ACTIVITY_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/PrepaTrackLiveActivity.mobileprovision"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/PrepaTrack.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/PrepaTrack.mobileprovision"
          cp "$RUNNER_TEMP/PrepaTrackLiveActivity.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/PrepaTrackLiveActivity.mobileprovision"
          echo "SIGNING_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
      - name: Archiver l'application signée
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          LIVE_ACTIVITY_PROFILE_NAME: ${{ secrets.IOS_LIVE_ACTIVITY_PROFILE_NAME }}
          APP_VERSION: ${{ steps.version.outputs.value }}
        run: |
          test -n "$TEAM_ID"
          test -n "$ISSUER_ID"
          test -n "$PROFILE_NAME"
          test -n "$LIVE_ACTIVITY_PROFILE_NAME"
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PrepaTrack.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            APP_PROFILE_NAME="$PROFILE_NAME" \
            LIVE_ACTIVITY_PROFILE_NAME="$LIVE_ACTIVITY_PROFILE_NAME" \
            TEAM_ID="$TEAM_ID" \
            MARKETING_VERSION="$APP_VERSION" \
            archive
      - name: Envoyer le build à App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          LIVE_ACTIVITY_PROFILE_NAME: ${{ secrets.IOS_LIVE_ACTIVITY_PROFILE_NAME }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>provisioningProfiles</key><dict>
              <key>com.n0thytvoff.prepatrack</key><string>${PROFILE_NAME}</string>
              <key>com.n0thytvoff.prepatrack.liveactivity</key><string>${LIVE_ACTIVITY_PROFILE_NAME}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/PrepaTrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Nettoyer le trousseau temporaire
        if: always()
        run: |
          if [ -n "${SIGNING_KEYCHAIN_PATH:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
