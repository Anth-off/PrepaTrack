name: CI

# Sur les pull requests visant main, sur les pushes dans main, et à la demande.
# Le push sur main reste utile : il valide l'état réel de la branche après une
# fusion en squash, dont le résultat peut différer de ce qui a été testé.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Une nouvelle exécution sur la même branche annule la précédente : inutile de
# tenir un agent occupé pour un commit déjà remplacé. Jamais sur main, dont
# chaque état doit rester vérifié.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Lecture seule : la CI n'écrit rien dans le dépôt.
permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  # Les quatre vérifications sont indépendantes et s'exécutent en parallèle.
  # Aucune ne dépend du résultat d'une autre.

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier les types
        run: npm run typecheck

  lint:
    name: Style du code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer la suite de tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      # `build:vite` et non `build` : la vérification des types tourne déjà dans
      # son propre job, la relancer ici doublerait le travail sans rien apporter.
      - name: Construire l'application
        run: npm run build:vite
      - name: Conserver le résultat du build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  database:
    name: Schéma de base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      # Contrôle hors ligne : ni identifiants, ni connexion, ni écriture. Il
      # vérifie que le schéma conserve ses tables, ses règles de sécurité et ses
      # protections contre la suppression en cascade.
      - name: Valider le schéma
        run: npm run db:check

  audit:
    name: Dépendances de production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: Nouvelles dépendances
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  # Point de contrôle unique : c'est ce job qu'il faut exiger dans les règles de
  # protection de branche, plutôt que d'y lister chaque vérification une à une.
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [typecheck, lint, test, build, database, audit, dependency-review]
    if: always()
    steps:
      - name: Vérifier que tout est passé
        run: |
          echo "typecheck : ${{ needs.typecheck.result }}"
          echo "lint      : ${{ needs.lint.result }}"
          echo "test      : ${{ needs.test.result }}"
          echo "build     : ${{ needs.build.result }}"
          echo "database  : ${{ needs.database.result }}"
          echo "audit     : ${{ needs.audit.result }}"
          echo "dépendances : ${{ needs.dependency-review.result }}"
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::Au moins une vérification a échoué."
            exit 1
          fi
